name: Format & Lint Check

on:
    pull_request:
    push:

jobs:
    lint:
        name: Code Quality Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install -y clang-format cppcheck python3 python3-pip
                  pip install black

            - name: Run clang-format check (C++ only)
              run: |
                  echo "Checking C++ format..."
                  FILES=$(find src include -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \))
                  if [ -n "$FILES" ]; then
                    clang-format --dry-run --Werror $FILES
                  else
                    echo "No C++ files found."
                  fi

            - name: Run cppcheck static analysis
              run: |
                  echo "Running cppcheck..."
                  cppcheck --enable=warning,style --quiet src include || true

            - name: Run black (Python format check)
              run: |
                  echo "Running black format check..."
                  if [ -d "scripts" ]; then
                    black --check scripts
                  else
                    echo "No Python scripts folder found."
                  fi

            - name: Summary
              run: echo "All checks completed successfully"
