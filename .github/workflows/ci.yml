name: ROS2 CI

on:
    push:
    pull_request:

jobs:
    build-test:
        runs-on: ubuntu-22.04

        env:
            ROS_DISTRO: humble
            ROS_WS: ${{ github.workspace }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Install ROS2 repo + ROS2 Humble
            - name: Setup ROS2
              run: |
                  sudo apt update && sudo apt install -y curl gnupg lsb-release
                  sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
                    -o /usr/share/keyrings/ros-archive-keyring.gpg

                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
                    http://packages.ros.org/ros2/ubuntu $(lsb_release -sc) main" | \
                    sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

                  sudo apt update
                  sudo apt install -y ros-humble-desktop \
                                      python3-colcon-common-extensions \
                                      python3-rosdep python3-pip

                  sudo rosdep init || true
                  rosdep update

            # Install format + lint tools
            - name: Install Lint Tools
              run: |
                  sudo apt install -y clang-format cppcheck
                  pip3 install --break-system-packages black flake8 || pip3 install black flake8
                    echo "$HOME/.local/bin" >> $GITHUB_PATH

            # rosdep install for workspace
            - name: rosdep install
              run: |
                  source /opt/ros/$ROS_DISTRO/setup.sh
                  rosdep install -y --from-paths src --ignore-src || true

            # C++ format check
            - name: Run clang-format
              run: |
                  FILES=$(find src -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \))
                  if [ -z "$FILES" ]; then
                    echo "ℹ️ No C++ files found. Skipping clang-format."
                  else
                    for FILE in $FILES; do
                      diff <(clang-format -style=file $FILE) $FILE > /dev/null || {
                        echo "❌ Format error in $FILE"
                        exit 1
                      }
                    done
                    echo "✅ C++ format OK"
                  fi

            # C++ static analyze
            - name: Run cppcheck
              run: |
                  if [ ! -d "src" ]; then
                    echo "ℹ️ No src folder. Skipping cppcheck."
                    exit 0
                  fi
                  FILES=$(find src -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \))
                  if [ -z "$FILES" ]; then
                    echo "ℹ️ No C++ source files. Skipping cppcheck."
                    exit 0
                  fi
                  cppcheck --enable=warning,style,performance,portability \
                           --error-exitcode=1 --inline-suppr src
                  echo "✅ C++ static analysis OK"

            # Python Black format check
            - name: Run Black
              run: |
                  FILES=$(find . -name "*.py")
                  if [ -z "$FILES" ]; then
                    echo "ℹ️ No Python files. Skipping black."
                    exit 0
                  fi
                  black --check .
                  echo "✅ Python format OK"

            # Python lint
            # - name: Run Flake8
            #   run: |
            #       FILES=$(find . -name "*.py")
            #       if [ -z "$FILES" ]; then
            #         echo "ℹ️ No Python files. Skipping flake8."
            #         exit 0
            #       fi
            #       flake8 --max-line-length=120
            #       echo "✅ Python lint OK"

            # Build package
            - name: Build ROS2 workspace
              run: |
                  source /opt/ros/$ROS_DISTRO/setup.sh
                  colcon build --event-handlers console_direct+ --symlink-install

            # Run tests
            - name: Test workspace
              run: |
                  source install/setup.sh
                  colcon test
                  colcon test-result --verbose
