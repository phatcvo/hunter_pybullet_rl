name: ROS CI

on:
    push:
    pull_request:

jobs:
    build-test:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # 🐧 Setup ROS (auto-detect ROS1 vs ROS2)
            - name: Setup ROS
              run: |
                  sudo sh -c 'echo "deb http://packages.ros.org/ros/ubuntu `lsb_release -sc` main" > /etc/apt/sources.list.d/ros-latest.list'
                  sudo apt install curl -y
                  curl -s https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -
                  sudo apt update

                  if [ -f /opt/ros/noetic/setup.sh ]; then
                    echo "Detected ROS1 (Noetic)"
                    sudo apt install -y ros-noetic-desktop-full python3-rosdep python3-catkin-tools
                  else
                    echo "Installing ROS2 Humble"
                    sudo apt install -y ros-humble-desktop python3-colcon-common-extensions
                  fi

                  sudo rosdep init || true
                  rosdep update

            # 📦 Install tooling
            - name: Install tools
              run: |
                  sudo apt install -y clang-format cppcheck
                  pip3 install black flake8

            # ✅ C++ format check
            - name: clang-format check
              run: |
                  FILES=$(find . -regex '.*\.\(cpp\|hpp\|h\|cc\)$')
                  for file in $FILES; do
                    clang-format -style=file $file | diff $file - > /dev/null
                    if [ $? -ne 0 ]; then
                      echo "Format issue: $file"
                      exit 1
                    fi
                  done
                  echo "✅ C++ format OK"

            # 🔍 C++ static analysis
            - name: cppcheck
              run: |
                  cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr .

            # 🐍 Python format
            - name: Python Black check
              run: |
                  black --check .

            # 🐍 Python Lint
            - name: Flake8 lint
              run: |
                  flake8 --max-line-length=120 .

            # 🛠️ Build & Test ROS workspace
            - name: Build & test
              run: |
                  source /opt/ros/*/setup.sh

                  if [ -f src/CMakeLists.txt ]; then
                    echo "Using catkin (ROS1)"
                    rosdep install --from-paths src --ignore-src -r -y
                    catkin_make -DCMAKE_BUILD_TYPE=Release
                    catkin_make run_tests
                  else
                    echo "Using colcon (ROS2)"
                    rosdep install --from-paths src --ignore-src -r -y
                    colcon build --symlink-install
                    colcon test
                    colcon test-result --verbose
                  fi
