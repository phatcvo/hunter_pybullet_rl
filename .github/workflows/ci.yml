name: ROS2 CI

on:
    push:
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-22.04

        env:
            ROS_DISTRO: humble
            ROS_WS: ${{ github.workspace }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            # 🛠️ ROS2 setup
            - name: Setup ROS2 repository
              run: |
                  sudo apt update && sudo apt install -y curl gnupg lsb-release
                  sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
                    -o /usr/share/keyrings/ros-archive-keyring.gpg

                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
                    http://packages.ros.org/ros2/ubuntu $(lsb_release -sc) main" | \
                    sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

                  sudo apt update
                  sudo apt install -y ros-humble-desktop python3-colcon-common-extensions \
                                      python3-rosdep python3-rospytest python3-pip

                  sudo rosdep init || true
                  rosdep update

            # 📦 Install dependencies & tools
            - name: Install formatting + lint tools
              run: |
                  sudo apt install -y clang-format cppcheck
                  pip3 install black flake8

            # ✅ Run ROS2 dependency install
            - name: rosdep install
              run: |
                  source /opt/ros/$ROS_DISTRO/setup.sh
                  rosdep install -y --from-paths src --ignore-src

            # 🔍 C++ formatting check
            - name: clang-format check
              run: |
                  echo "Checking C++ format..."
                  FILES=$(find . -regex '.*\.\(cpp\|hpp\|h\|cc\)$')
                  for f in $FILES; do
                    diff <(clang-format -style=file $f) $f > /dev/null || {
                      echo "❌ Format issue in $f"
                      exit 1
                    }
                  done
                  echo "✅ C++ format OK"

            # 🧪 C++ static analyze
            - name: cppcheck
              run: |
                  cppcheck --enable=warning,style,performance,portability \
                           --error-exitcode=1 --inline-suppr src || exit 1

            # 🐍 Python formatting check
            - name: Python black check
              run: black --check .

            # 🐍 Python lint
            - name: Flake8 lint
              run: flake8 --max-line-length=120

            # 🛠️ Build workspace
            - name: colcon build
              run: |
                  source /opt/ros/$ROS_DISTRO/setup.sh
                  colcon build --event-handlers console_direct+ --symlink-install

            # 🧪 Test workspace
            - name: colcon test
              run: |
                  source install/setup.sh
                  colcon test
                  colcon test-result --verbose
